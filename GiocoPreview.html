<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#fde047">
    <title>UNO? REVOLUTION — Test Preview</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/mobile.css">
    <link rel="stylesheet" href="css/game-arena.css">
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .btn-purple { background-color: #a855f7; color: #fff; box-shadow: 0 8px 0 #7e22ce; }

        /* Carte (stile Index / UNO) */
        .gc-card {
            position: relative;
            border-radius: 0.75rem;
            border: 3px solid rgba(255, 255, 255, 0.92);
            box-shadow: 0 6px 0 rgba(0, 0, 0, 0.38), 0 10px 22px rgba(0, 0, 0, 0.32);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            overflow: hidden;
            user-select: none;
            transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
        }

        .gc-card-pile {
            width: 7.25rem;
            height: 10.25rem;
            padding: 0.45rem 0.35rem 0.5rem;
            cursor: pointer;
        }

        .gc-card-pile:hover:not(.gc-card-disabled) {
            transform: translateY(-4px) scale(1.03);
            filter: brightness(1.05);
        }

        .gc-card-hand {
            flex: 0 0 auto;
            width: 5.25rem;
            height: 7.5rem;
            padding: 0.35rem 0.3rem 0.4rem;
            cursor: pointer;
        }

        #my-hand.hand-size-many .gc-card-hand,
        #my-hand.hand-size-crowded .gc-card-hand {
            width: 4.35rem;
            height: 6.25rem;
        }

        .hand-card-slot:hover .gc-card-hand:not(.gc-card-disabled):not(:disabled) {
            transform: translateY(-10px) scale(1.05);
            box-shadow: 0 10px 0 rgba(0, 0, 0, 0.32), 0 16px 28px rgba(0, 0, 0, 0.38);
            z-index: 5;
        }

        .gc-card-disabled,
        .gc-card-hand:disabled {
            opacity: 1;
            cursor: not-allowed;
            filter: brightness(0.55) saturate(0.72);
        }

        .gc-card-disabled::after,
        .gc-card-hand:disabled::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: rgba(0, 0, 0, 0.42);
            pointer-events: none;
            z-index: 4;
        }

        .gc-card-counter {
            outline: 3px solid #f59e0b;
            box-shadow: 0 0 16px rgba(245, 158, 11, 0.5), 0 6px 0 rgba(0, 0, 0, 0.35);
        }

        .gc-card-selected {
            outline: 3px solid #38bdf8;
            transform: translateY(-14px) scale(1.06);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.55), 0 8px 0 rgba(0, 0, 0, 0.32);
            z-index: 6;
        }

        .gc-card-mari { outline: 3px solid #22c55e; box-shadow: 0 0 16px rgba(34, 197, 94, 0.45); }
        .gc-card-ladder-hint { outline: 2px dashed #a78bfa; }
        .gc-card-dup-group { outline: 2px dashed rgba(56, 189, 248, 0.65); }

        .gc-corner {
            position: absolute;
            font-weight: 900;
            line-height: 1;
            text-shadow: 0 1px 0 rgba(0, 0, 0, 0.25);
        }

        .gc-corner-tl { top: 0.35rem; left: 0.4rem; font-size: 0.85rem; }
        .gc-corner-br {
            bottom: 0.35rem;
            right: 0.4rem;
            font-size: 0.85rem;
            transform: rotate(180deg);
        }

        .gc-card-center {
            font-size: 1.65rem;
            font-weight: 900;
            line-height: 1.05;
            text-shadow: 0 2px 0 rgba(0, 0, 0, 0.25);
            word-break: break-word;
            padding: 0 0.2rem;
        }

        .gc-card-pile .gc-card-center { font-size: 1.85rem; }
        .gc-card-hand .gc-card-center { font-size: 1.35rem; }
        #my-hand.hand-size-crowded .gc-card-center { font-size: 1rem; }

        .gc-card-sub {
            position: absolute;
            bottom: 0.38rem;
            left: 0.25rem;
            right: 0.25rem;
            font-size: 0.42rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            opacity: 0.92;
            line-height: 1.15;
            max-height: 2.2em;
            overflow: hidden;
        }

        .gc-card-brainrot-name {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 0.15rem 0.2rem 1rem;
            font-size: 0.48rem;
            font-weight: 900;
            line-height: 1.12;
            word-break: break-word;
        }

        .gc-card-pt {
            position: absolute;
            right: 0.35rem;
            bottom: 0.35rem;
            font-size: 0.52rem;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.55);
        }

        .gc-card-red { background: #dc2626; color: #fff; }
        .gc-card-yellow { background: #eab308; color: #0f172a; }
        .gc-card-green { background: #16a34a; color: #fff; }
        .gc-card-blue { background: #2563eb; color: #fff; }
        .gc-card-black {
            background: linear-gradient(145deg, #1f2937 0%, #020617 100%);
            color: #f8fafc;
        }
        .gc-card-wild {
            background: linear-gradient(145deg, #64748b 0%, #334155 100%);
            color: #fff;
        }
        .gc-card-brainrot { background: linear-gradient(160deg, #312e81, #1e1b4b); color: #e0e7ff; }
        .gc-card-battle-yellow { background: #eab308; color: #0f172a; }
        .gc-card-battle-white { background: #f1f5f9; color: #0f172a; }
        .gc-card-battle-pink { background: #ec4899; color: #fff; }
        .gc-card-battle-blue { background: #2563eb; color: #fff; }

        .gc-card-draw-back {
            background: linear-gradient(145deg, #b91c1c 0%, #7f1d1d 55%, #450a0a 100%);
            color: #fef3c7;
            cursor: pointer;
        }

        .gc-card-draw-back::after {
            content: 'UNO?';
            font-weight: 900;
            font-size: 1.05rem;
            letter-spacing: 0.08em;
            transform: rotate(-8deg);
            opacity: 0.95;
        }

        .gc-card-draw-back.pile-draw-disabled {
            opacity: 0.4;
            filter: grayscale(0.35);
            cursor: not-allowed;
        }

        #deck-discard { transform: rotate(5deg); }

        .draw-count {
            position: absolute;
            bottom: -0.45rem;
            right: -0.45rem;
            background: #0f172a;
            border: 2px solid #facc15;
            color: #facc15;
            font-size: 0.62rem;
            font-weight: 900;
            padding: 0.15rem 0.45rem;
            border-radius: 999px;
            z-index: 2;
        }

        .gc-dup-badge,
        .gc-dup-sel {
            position: absolute;
            top: 0.3rem;
            left: 0.3rem;
            font-size: 0.48rem;
            font-weight: 900;
            padding: 0.1rem 0.3rem;
            border-radius: 0.35rem;
            background: rgba(0, 0, 0, 0.35);
            z-index: 2;
        }

        .gc-dup-sel { color: #7dd3fc; }
        .gc-dup-badge { color: #fde68a; }
        .gc-ladder-badge {
            position: absolute;
            top: 0.3rem;
            right: 0.3rem;
            font-size: 0.45rem;
            font-weight: 900;
            padding: 0.1rem 0.3rem;
            border-radius: 0.35rem;
            background: rgba(16, 185, 129, 0.85);
            color: #ecfdf5;
            z-index: 3;
            cursor: pointer;
            pointer-events: auto;
        }
        .gc-ladder-badge:hover { filter: brightness(1.12); }
        .gc-ladder-dup-hint {
            position: absolute;
            bottom: 0.3rem;
            right: 0.3rem;
            font-size: 0.55rem;
            font-weight: 900;
            padding: 0.05rem 0.25rem;
            border-radius: 0.3rem;
            background: rgba(167, 139, 250, 0.9);
            color: #f5f3ff;
            z-index: 3;
            pointer-events: none;
        }

        .hand-empty-msg {
            color: #94a3b8;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 1rem;
        }

        .modal-target-revive {
            border-color: #4ade80 !important;
            background: linear-gradient(180deg, #166534, #14532d) !important;
        }

        .modal-color-btn, .modal-target-btn {
            width: 100%;
            padding: 0.75rem;
            border-radius: 12px;
            font-weight: 800;
            margin-bottom: 0.5rem;
            border: 2px solid #475569;
            background: #1e293b;
            color: #fff;
        }

        .modal-color-btn.color-red { background: #dc2626; border-color: #fca5a5; }
        .modal-color-btn.color-yellow { background: #eab308; color: #0f172a; border-color: #fef08a; }
        .modal-color-btn.color-green { background: #16a34a; border-color: #86efac; }
        .modal-color-btn.color-blue { background: #2563eb; border-color: #93c5fd; }

        /* Roulette */
        #bullet-roulette-overlay {
            position: fixed;
            inset: 0;
            z-index: 80;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            pointer-events: none;
        }

        #bullet-roulette-overlay.active { pointer-events: auto; }
        #bullet-roulette-overlay.hidden { display: none; }

        .roulette-panel {
            width: min(92vw, 380px);
            margin-bottom: 8vh;
            padding: 1.5rem 1.25rem 1.75rem;
            background: linear-gradient(165deg, #1e293b 0%, #0f172a 55%, #020617 100%);
            border: 3px solid #fbbf24;
            border-radius: 1.75rem 1.75rem 1rem 1rem;
            box-shadow: 0 -12px 48px rgba(251, 191, 36, 0.22);
            transform: translateY(110%);
            transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
            text-align: center;
        }

        #bullet-roulette-overlay.active .roulette-panel { transform: translateY(0); }

        .roulette-wheel-wrap {
            position: relative;
            width: min(72vw, 280px);
            height: min(72vw, 280px);
            margin: 0.75rem auto 0;
        }

        .roulette-pointer-fixed {
            position: absolute;
            left: 50%;
            top: -6px;
            transform: translateX(-50%);
            z-index: 12;
            font-size: 2.25rem;
            color: #fef08c;
            pointer-events: none;
        }

        .roulette-wheel {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 6px solid #78350f;
            overflow: hidden;
            will-change: transform;
            background-color: #1e293b;
        }

        .roulette-svg { position: absolute; inset: 0; width: 100%; height: 100%; }
        .roulette-hub {
            position: absolute;
            left: 50%; top: 50%;
            width: 18%; height: 18%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #fde68a, #b45309 70%, #78350f);
            border: 3px solid #fef3c7;
            z-index: 5;
        }

        .roulette-result { margin-top: 0.75rem; font-size: 0.9rem; font-weight: 800; color: #fca5a5; min-height: 1.25rem; }

        body.uno-game .log-panel-wrap {
            top: 4.6rem;
        }

        #preview-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 120;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            padding: 0.45rem 0.85rem;
            background: linear-gradient(90deg, #1e3a5f, #0f172a);
            border-bottom: 2px solid #38bdf8;
            font-size: 0.72rem;
            font-weight: 800;
            color: #e2e8f0;
        }

        #preview-bar .preview-actions {
            display: flex;
            gap: 0.45rem;
            flex-shrink: 0;
        }

        #preview-bar .preview-btn {
            border: none;
            border-radius: 999px;
            padding: 0.35rem 0.75rem;
            font-size: 0.68rem;
            font-weight: 900;
            text-transform: uppercase;
            cursor: pointer;
            background: #10b981;
            color: #fff;
        }

        #preview-bar .preview-btn--ghost {
            background: #334155;
            color: #e2e8f0;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
        }

        body.uno-game.game-root { padding-top: 2.35rem; }

        /* Pannello carte test Preview */
        #preview-cheat-panel {
            position: fixed;
            top: 2.35rem;
            right: 0;
            bottom: 0;
            width: min(22rem, 92vw);
            z-index: 115;
            display: flex;
            flex-direction: column;
            background: linear-gradient(180deg, #0f172a 0%, #020617 100%);
            border-left: 2px solid #a78bfa;
            box-shadow: -8px 0 32px rgba(0, 0, 0, 0.45);
            transform: translateX(100%);
            transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
            pointer-events: none;
        }

        #preview-cheat-panel.is-open {
            transform: translateX(0);
            pointer-events: auto;
        }

        @media (min-width: 900px) {
            body.preview-cheat-open .game-arena {
                margin-right: 22rem;
                transition: margin-right 0.28s cubic-bezier(0.22, 1, 0.36, 1);
            }
        }

        .preview-cheat-head {
            flex-shrink: 0;
            padding: 0.65rem 0.75rem 0.5rem;
            border-bottom: 1px solid #334155;
        }

        .preview-cheat-title-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
            margin-bottom: 0.45rem;
        }

        .preview-cheat-title {
            font-size: 0.78rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: #c4b5fd;
        }

        .preview-cheat-close {
            border: none;
            background: #334155;
            color: #e2e8f0;
            width: 1.65rem;
            height: 1.65rem;
            border-radius: 0.45rem;
            font-size: 1rem;
            line-height: 1;
            cursor: pointer;
        }

        .preview-cheat-status {
            font-size: 0.68rem;
            font-weight: 800;
            color: #94a3b8;
        }

        .preview-cheat-search {
            width: 100%;
            margin-top: 0.45rem;
            padding: 0.45rem 0.6rem;
            border-radius: 0.5rem;
            border: 1px solid #475569;
            background: #1e293b;
            color: #f1f5f9;
            font-size: 0.72rem;
            font-weight: 700;
        }

        .preview-cheat-search::placeholder { color: #64748b; }

        #preview-cheat-filters {
            flex-shrink: 0;
            display: flex;
            flex-wrap: wrap;
            gap: 0.35rem;
            padding: 0.5rem 0.75rem;
            border-bottom: 1px solid #1e293b;
        }

        .preview-cheat-chip {
            border: 1px solid #475569;
            background: #1e293b;
            color: #cbd5e1;
            border-radius: 999px;
            padding: 0.2rem 0.55rem;
            font-size: 0.58rem;
            font-weight: 900;
            text-transform: uppercase;
            cursor: pointer;
        }

        .preview-cheat-chip.is-active {
            background: #7c3aed;
            border-color: #c4b5fd;
            color: #fff;
        }

        #preview-cheat-list {
            flex: 1;
            overflow-y: auto;
            padding: 0.35rem 0.5rem 0.75rem;
        }

        .preview-cheat-row {
            display: grid;
            grid-template-columns: 0.55rem 1fr auto auto;
            align-items: center;
            gap: 0.4rem;
            padding: 0.35rem 0.25rem;
            border-radius: 0.45rem;
        }

        .preview-cheat-row:hover { background: rgba(51, 65, 85, 0.45); }

        .preview-cheat-dot {
            width: 0.55rem;
            height: 0.55rem;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .preview-cheat-dot--red { background: #dc2626; }
        .preview-cheat-dot--yellow { background: #eab308; }
        .preview-cheat-dot--green { background: #16a34a; }
        .preview-cheat-dot--blue { background: #2563eb; }
        .preview-cheat-dot--black { background: #334155; border: 1px solid #64748b; }
        .preview-cheat-dot--wild { background: linear-gradient(135deg, #dc2626, #eab308, #16a34a, #2563eb); }

        .preview-cheat-label {
            font-size: 0.65rem;
            font-weight: 800;
            color: #e2e8f0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .preview-cheat-btn {
            border: none;
            border-radius: 0.4rem;
            width: 1.65rem;
            height: 1.65rem;
            font-size: 0.85rem;
            font-weight: 900;
            cursor: pointer;
            line-height: 1;
        }

        .preview-cheat-btn--hand {
            background: #10b981;
            color: #fff;
        }

        .preview-cheat-btn--table {
            background: #334155;
            color: #a5b4fc;
            font-size: 0.72rem;
        }

        .preview-cheat-foot {
            flex-shrink: 0;
            display: flex;
            gap: 0.4rem;
            padding: 0.55rem 0.75rem 0.75rem;
            border-top: 1px solid #334155;
        }

        .preview-cheat-foot-btn {
            flex: 1;
            border: none;
            border-radius: 0.5rem;
            padding: 0.45rem 0.5rem;
            font-size: 0.62rem;
            font-weight: 900;
            text-transform: uppercase;
            cursor: pointer;
        }

        .preview-cheat-foot-btn--danger {
            background: #7f1d1d;
            color: #fecaca;
        }

        .preview-cheat-foot-btn--ghost {
            background: #1e293b;
            color: #94a3b8;
        }

        .preview-cheat-empty {
            font-size: 0.7rem;
            font-weight: 700;
            color: #64748b;
            text-align: center;
            padding: 1.5rem 0.5rem;
        }

        #btn-preview-cheat.is-active {
            background: #7c3aed;
            box-shadow: 0 0 0 2px #c4b5fd;
        }

        #mode-intro-overlay {
            position: fixed;
            inset: 0;
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.25rem;
            background: rgba(0, 0, 0, 0.62);
            backdrop-filter: blur(4px);
        }

        #mode-intro-overlay.hidden { display: none !important; }

        .mode-intro-panel {
            width: min(100%, 26rem);
            border-radius: 1.5rem;
            border: 2px solid #334155;
            background: linear-gradient(165deg, #1e293b, #0f172a);
            padding: 1.35rem 1.25rem;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
        }

        .mode-intro-panel h3 {
            font-size: 1.2rem;
            font-weight: 900;
            color: #fde68a;
            text-transform: uppercase;
            margin-bottom: 0.65rem;
        }

        #mode-intro-body {
            font-size: 0.82rem;
            font-weight: 700;
            color: #cbd5e1;
            line-height: 1.45;
        }

        #mode-intro-dismiss {
            margin-top: 1rem;
            width: 100%;
            border: none;
            border-radius: 1rem;
            padding: 0.75rem;
            font-weight: 900;
            text-transform: uppercase;
            background: #facc15;
            color: #451a03;
            box-shadow: 0 6px 0 #ca8a04;
            cursor: pointer;
        }
    </style>
    <script>window.__UNO_PREVIEW__ = true;</script>
    <script src="js/avatar-ui.js"></script>
    <script src="js/game-sounds.js"></script>
    <script src="js/game-deck.js"></script>
    <script src="js/carte-data.js"></script>
    <script src="js/game-card-ui.js"></script>
    <script src="js/card-info.js"></script>
    <script src="js/game-engine.js"></script>
    <script src="js/game-firestore.js"></script>
    <script src="js/game-modes.js"></script>
    <script src="js/game-preview.js"></script>

</head>
<body class="uno-page uno-game game-root select-none">

    <div id="mode-intro-overlay" class="hidden" role="dialog" aria-modal="true">
        <div class="mode-intro-panel">
            <h3 id="mode-intro-title">Modalità</h3>
            <div id="mode-intro-body"></div>
            <button type="button" id="mode-intro-dismiss">Inizia</button>
        </div>
    </div>

    <div id="preview-bar">
        <span id="preview-bar-label">Test locale con bot</span>
        <div class="preview-actions">
            <button type="button" id="btn-preview-cheat" class="preview-btn" style="background:#7c3aed" data-sound="click" title="Aggiungi carte alla mano per test">Carte test</button>
            <button type="button" id="btn-preview-restart" class="preview-btn" data-sound="click">Nuova partita</button>
            <a href="Menu_principale.html" class="preview-btn preview-btn--ghost">Menu</a>
        </div>
    </div>

    <header class="game-topbar">
        <div class="game-logo">
            <span class="game-logo-icon">🃏</span>
            <span>UNO? PREVIEW</span>
        </div>
        <div id="turn-alert" class="hidden">—</div>
        <div class="topbar-actions">
            <button type="button" class="topbar-icon-btn" title="Regole (menu)" data-sound="click">📋</button>
            <button id="btn-leave" type="button" class="topbar-icon-btn" title="Esci" data-sound="error">✕</button>
        </div>
    </header>

    <main class="game-arena">
        <div class="arena-viewport">
            <div id="opponents-arena" aria-label="Avversari"></div>

            <div id="stack-alert" class="hidden">Stack attivo</div>
            <div id="pending-banner" aria-live="polite"></div>

            <div class="arena-middle">
                <aside class="status-panel">
                    <div class="stat-box">
                        <label>Modalità</label>
                        <span id="game-mode" class="stat-value">CLASSICA</span>
                    </div>
                    <div class="stat-box">
                        <label>Direzione</label>
                        <span id="game-direction" class="stat-value">Oraria</span>
                    </div>
                    <div class="stat-box">
                        <label>Colore attivo</label>
                        <span id="active-color-dot" class="color-slate" title="—"></span>
                    </div>
                </aside>

                <div class="pile-stage">
                    <div id="dir-ring" class="dir-ring" aria-hidden="true"></div>
                    <span id="dir-ring-label" class="dir-ring-label">Oraria</span>
                    <div class="center-piles">
                        <div id="deck-draw" class="gc-card gc-card-pile gc-card-draw-back" title="Pesca" role="button" tabindex="0" data-sound="draw">
                            <span id="draw-count" class="draw-count">0</span>
                        </div>
                        <div id="deck-discard" class="gc-card gc-card-pile gc-card-blue" aria-label="Ultima carta giocata">
                            <span class="gc-card-center">—</span>
                        </div>
                    </div>
                </div>

                <aside class="action-rail">
                    <button type="button" id="btn-pesca" class="action-tile action-tile--draw" data-sound="draw">
                        <span class="action-tile-icon">🎴</span>
                        Pesca
                    </button>
                    <button type="button" id="btn-contrast" class="action-tile action-tile--shield" disabled data-sound="bloop">
                        <span class="action-tile-icon">🛡️</span>
                        Contrasta
                    </button>
                    <div id="timer-ring" class="timer-ring hidden">
                        <svg viewBox="0 0 36 36" aria-hidden="true">
                            <circle class="track" cx="18" cy="18" r="15.5"></circle>
                            <circle class="progress" cx="18" cy="18" r="15.5"></circle>
                        </svg>
                        <span id="counter-timer">05</span>
                        <small>SEC</small>
                    </div>
                </aside>
            </div>
        </div>

        <footer class="player-stage">
            <div id="my-dossier" class="player-dossier">
                <div class="dossier-row">
                    <div id="my-dossier-avatar" class="dossier-avatar">🦊</div>
                    <div class="dossier-info">
                        <div id="my-player-label" class="dossier-name">Giocatore</div>
                        <div class="dossier-badges">
                            <span id="my-player-star" class="dossier-badge dossier-badge--star">★ 0</span>
                            <span id="my-player-meta" class="dossier-badge dossier-badge--cards">0 🃏</span>
                        </div>
                    </div>
                </div>
                <button id="btn-uno" type="button" class="btn-uno-mini" data-sound="uno">UNO!</button>
            </div>

            <div class="hand-fan-zone">
                <div id="play-selection-bar" class="hidden">
                    <span id="play-selection-label">—</span>
                    <button type="button" id="btn-play-all-dup" class="hidden btn-chunky btn-cyan play-sel-btn" data-sound="click">Tutte</button>
                    <button type="button" id="btn-play-ladder-alt" class="hidden btn-chunky btn-purple play-sel-btn" data-sound="click">Scala</button>
                    <button type="button" id="btn-confirm-play" class="btn-chunky btn-emerald play-sel-btn" data-sound="bloop">Gioca</button>
                    <button type="button" id="btn-cancel-play" class="btn-chunky btn-slate play-sel-btn" data-sound="pop">Annulla</button>
                </div>
                <div class="hand-fan-wrap no-scrollbar">
                    <div id="my-hand" class="hand-size-normal"></div>
                </div>
            </div>

            <button id="btn-end-turn" type="button" class="btn-fine-turno" disabled data-sound="bloop">Fine<br>Turno</button>
        </footer>
    </main>

    <div id="counter-overlay" class="hidden" aria-hidden="true">
        <p>—</p>
        <span id="counter-timer-fallback">5</span>
    </div>

    <div id="log-panel-wrap" class="log-panel-wrap" aria-hidden="true">
        <button type="button" id="btn-log-toggle" class="log-panel-toggle" aria-expanded="false" aria-controls="game-log-panel" title="Apri log partita">
            <span class="log-toggle-arrow" aria-hidden="true">◂</span>
        </button>
        <aside id="game-log-panel" class="game-log-panel" aria-label="Log partita">
            <header class="game-log-panel-head">Log</header>
            <div id="game-log-scroll" class="game-log-panel-body no-scrollbar"></div>
        </aside>
    </div>

    <div id="game-toast" class="hidden"></div>

    <div id="card-info-tooltip" class="hidden" role="tooltip" aria-hidden="true"></div>

    <div id="card-info-sheet" class="hidden" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="card-info-sheet-body">
        <div class="card-info-sheet-backdrop"></div>
        <div class="card-info-sheet-panel">
            <button type="button" class="card-info-sheet-close" aria-label="Chiudi scheda carta">×</button>
            <div id="card-info-sheet-preview" class="card-info-sheet-preview"></div>
            <div id="card-info-sheet-body"></div>
        </div>
    </div>

    <div id="game-modal" class="game-modal hidden">
        <div class="game-modal-panel">
            <h2 id="modal-title" class="game-modal-title">—</h2>
            <p id="modal-description" class="game-modal-desc"></p>
            <div id="modal-content"></div>
        </div>
    </div>

    <div id="bullet-roulette-overlay" class="hidden">
        <div class="roulette-panel">
            <div class="text-xs font-black uppercase tracking-widest text-amber-400 mb-1">🔫 Roulette Russa</div>
            <div class="roulette-wheel-wrap">
                <div class="roulette-pointer-fixed" aria-hidden="true">▼</div>
                <div id="roulette-wheel" class="roulette-wheel"></div>
            </div>
            <p id="roulette-hint" class="text-[11px] text-slate-400 mt-2 font-bold"></p>
            <button type="button" id="roulette-spin-btn" class="btn-chunky btn-red roulette-spin-btn" disabled data-sound="bloop">Gira la ruota</button>
            <p id="roulette-result" class="roulette-result"></p>
        </div>
    </div>

    <aside id="preview-cheat-panel" aria-label="Pannello carte test">
        <div class="preview-cheat-head">
            <div class="preview-cheat-title-row">
                <span class="preview-cheat-title">🧪 Carte test</span>
                <button type="button" id="preview-cheat-close" class="preview-cheat-close" aria-label="Chiudi pannello">×</button>
            </div>
            <div id="preview-cheat-status" class="preview-cheat-status">Mano: — carte</div>
            <input type="search" id="preview-cheat-search" class="preview-cheat-search" placeholder="Cerca carta…" autocomplete="off">
        </div>
        <div id="preview-cheat-filters"></div>
        <div id="preview-cheat-list" class="no-scrollbar"></div>
        <div class="preview-cheat-foot">
            <button type="button" id="preview-cheat-clear" class="preview-cheat-foot-btn preview-cheat-foot-btn--danger">Svuota mano</button>
            <button type="button" id="preview-cheat-refresh" class="preview-cheat-foot-btn preview-cheat-foot-btn--ghost">Aggiorna</button>
        </div>
    </aside>

    <div id="end-overlay" class="end-overlay hidden">
        <div class="end-overlay-panel">
            <h2 id="end-title" class="end-overlay-title">—</h2>
            <p id="end-duration" class="end-overlay-duration">—</p>
            <p id="end-rewards" class="end-overlay-rewards"></p>
            <p class="end-overlay-hint">Ritorno alla sala d'attesa tra pochi secondi…</p>
        </div>
    </div>

    <script src="js/game-client.js"></script>
    <script src="js/game-preview-cheat.js"></script>
</body>
</html>
