<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#2563eb">
    <title>UNO? REVOLUTION — Test Preview</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/mobile.css">
    <link rel="stylesheet" href="css/game-arena.css">
    <link rel="stylesheet" href="css/game-cards.css">
    <link rel="stylesheet" href="css/game-preview.css">
    <script>window.__UNO_PREVIEW__ = true;</script>
    <script src="js/avatar-ui.js"></script>
    <script src="js/game-sounds.js"></script>
    <script src="js/game-deck.js"></script>
    <script src="js/carte-data.js"></script>
    <script src="js/game-card-ui.js"></script>
    <script src="js/card-info.js"></script>
    <script src="js/game-engine.js"></script>
    <script src="js/game-firestore.js"></script>
    <script src="js/game-modes.js"></script>
    <script src="js/game-preview.js"></script>
    <script src="js/admin-config.js"></script>
    <script src="js/ui-transitions.js"></script>
    <script src="js/lobby-notice.js"></script>
</head>
<body class="uno-page uno-game game-root select-none">

    <div id="mode-intro-overlay" class="hidden" role="dialog" aria-modal="true">
        <div class="mode-intro-panel">
            <h3 id="mode-intro-title">Modalità</h3>
            <div id="mode-intro-body"></div>
            <button type="button" id="mode-intro-dismiss">Inizia</button>
        </div>
    </div>

    <div id="preview-bar">
        <span id="preview-bar-label">Test locale con bot</span>
        <div class="preview-actions">
            <button type="button" id="btn-preview-cheat" class="preview-btn" style="background:#7c3aed" data-sound="click" title="Aggiungi carte alla mano per test">Carte test</button>
            <button type="button" id="btn-preview-restart" class="preview-btn" data-sound="click">Nuova partita</button>
            <a href="Menu_principale.html" class="preview-btn preview-btn--ghost">Menu</a>
        </div>
    </div>

    <header class="game-topbar">
        <div class="game-logo">
            <span class="game-logo-icon">🃏</span>
            <span>UNO? PREVIEW</span>
        </div>
        <div id="turn-alert" class="hidden">—</div>
        <div class="topbar-actions">
            <button type="button" class="topbar-icon-btn" title="Regole (menu)" data-sound="click">📋</button>
            <button id="btn-leave" type="button" class="topbar-icon-btn" title="Esci" data-sound="error">✕</button>
        </div>
    </header>

    <main class="game-arena">
        <div class="arena-viewport">
            <div id="opponents-arena" aria-label="Avversari"></div>

            <div id="stack-alert" class="hidden">Stack attivo</div>
            <div id="pending-banner" aria-live="polite"></div>

            <div class="arena-middle">
                <aside class="status-panel">
                    <div class="stat-box">
                        <label>Modalità</label>
                        <span id="game-mode" class="stat-value">CLASSICA</span>
                    </div>
                    <div class="stat-box">
                        <label>Direzione</label>
                        <span id="game-direction" class="stat-value">Oraria</span>
                    </div>
                    <div class="stat-box">
                        <label>Colore attivo</label>
                        <span id="active-color-dot" class="color-slate" title="—"></span>
                    </div>
                </aside>

                <div class="pile-stage">
                    <div id="dir-ring" class="dir-ring" aria-hidden="true"></div>
                    <span id="dir-ring-label" class="dir-ring-label">Oraria</span>
                    <div class="center-piles">
                        <div class="draw-pile-stack">
                            <button type="button" id="btn-invoke-devito" class="btn-invoke-devito hidden" data-sound="win">Invoca De Vito</button>
                            <div id="deck-draw" class="gc-card gc-card-pile gc-card-draw-back" title="Pesca" role="button" tabindex="0" data-sound="draw">
                                <span id="draw-count" class="draw-count">0</span>
                            </div>
                        </div>
                        <div id="deck-discard" class="gc-card gc-card-pile gc-card-blue" aria-label="Ultima carta giocata">
                            <span class="gc-card-center">—</span>
                        </div>
                    </div>
                </div>

                <aside class="action-rail">
                    <button type="button" id="btn-pesca" class="action-tile action-tile--draw" data-sound="draw">
                        <span class="action-tile-icon">🎴</span>
                        Pesca
                    </button>
                    <button type="button" id="btn-contrast" class="action-tile action-tile--shield" disabled data-sound="bloop">
                        <span class="action-tile-icon">🛡️</span>
                        Contrasta
                    </button>
                    <div id="timer-ring" class="timer-ring hidden">
                        <svg viewBox="0 0 36 36" aria-hidden="true">
                            <circle class="track" cx="18" cy="18" r="15.5"></circle>
                            <circle class="progress" cx="18" cy="18" r="15.5"></circle>
                        </svg>
                        <span id="counter-timer">05</span>
                        <small>SEC</small>
                    </div>
                </aside>
            </div>
        </div>

        <footer class="player-stage">
            <div id="my-dossier" class="player-dossier">
                <div class="dossier-row">
                    <div id="my-dossier-avatar" class="dossier-avatar">🦊</div>
                    <div class="dossier-info">
                        <div id="my-player-label" class="dossier-name">Giocatore</div>
                        <div class="dossier-badges">
                            <span id="my-player-star" class="dossier-badge dossier-badge--star">★ 0</span>
                            <span id="my-player-meta" class="dossier-badge dossier-badge--cards">0 🃏</span>
                        </div>
                    </div>
                </div>
                <button id="btn-uno" type="button" class="btn-uno-mini" data-sound="uno">UNO!</button>
            </div>

            <div class="hand-fan-zone">
                <div id="play-selection-bar" class="hidden">
                    <span id="play-selection-label">—</span>
                    <button type="button" id="btn-play-all-dup" class="hidden btn-chunky btn-cyan play-sel-btn" data-sound="click">Tutte</button>
                    <button type="button" id="btn-play-ladder-alt" class="hidden btn-chunky btn-purple play-sel-btn" data-sound="click">Scala</button>
                    <button type="button" id="btn-confirm-play" class="btn-chunky btn-emerald play-sel-btn" data-sound="bloop">Gioca</button>
                    <button type="button" id="btn-cancel-play" class="btn-chunky btn-slate play-sel-btn" data-sound="pop">Annulla</button>
                </div>
                <div class="hand-fan-wrap no-scrollbar">
                    <div id="my-hand" class="hand-size-normal"></div>
                </div>
            </div>

            <button id="btn-end-turn" type="button" class="btn-fine-turno" disabled data-sound="bloop">Fine<br>Turno</button>
        </footer>
    </main>

    <div id="counter-overlay" class="hidden" aria-hidden="true">
        <p>—</p>
        <span id="counter-timer-fallback">5</span>
    </div>

    <div id="log-panel-wrap" class="log-panel-wrap" aria-hidden="true">
        <button type="button" id="btn-log-toggle" class="log-panel-toggle" aria-expanded="false" aria-controls="game-log-panel" title="Apri log partita">
            <span class="log-toggle-arrow" aria-hidden="true">◂</span>
        </button>
        <aside id="game-log-panel" class="game-log-panel" aria-label="Log partita">
            <header class="game-log-panel-head">Log</header>
            <div id="game-log-scroll" class="game-log-panel-body no-scrollbar"></div>
        </aside>
    </div>

    <div id="game-toast" class="hidden"></div>

    <div id="card-info-tooltip" class="hidden" role="tooltip" aria-hidden="true"></div>

    <div id="card-info-sheet" class="hidden" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="card-info-sheet-body">
        <div class="card-info-sheet-backdrop"></div>
        <div class="card-info-sheet-panel">
            <button type="button" class="card-info-sheet-close" aria-label="Chiudi scheda carta">×</button>
            <div id="card-info-sheet-preview" class="card-info-sheet-preview"></div>
            <div id="card-info-sheet-body"></div>
        </div>
    </div>

    <div id="game-modal" class="game-modal hidden">
        <div class="game-modal-panel">
            <h2 id="modal-title" class="game-modal-title">—</h2>
            <p id="modal-description" class="game-modal-desc"></p>
            <div id="modal-content"></div>
        </div>
    </div>

    <div id="bullet-roulette-overlay" class="hidden">
        <div class="roulette-panel">
            <div class="text-xs font-black uppercase tracking-widest text-amber-400 mb-1">🔫 Roulette Russa</div>
            <div class="roulette-wheel-wrap">
                <div class="roulette-pointer-fixed" aria-hidden="true">▼</div>
                <div id="roulette-wheel" class="roulette-wheel"></div>
            </div>
            <p id="roulette-hint" class="text-[11px] text-slate-400 mt-2 font-bold"></p>
            <button type="button" id="roulette-spin-btn" class="btn-chunky btn-red roulette-spin-btn" disabled data-sound="bloop">Gira la ruota</button>
            <p id="roulette-result" class="roulette-result"></p>
        </div>
    </div>

    <aside id="preview-cheat-panel" aria-label="Pannello carte test">
        <div class="preview-cheat-head">
            <div class="preview-cheat-title-row">
                <span class="preview-cheat-title">🧪 Carte test</span>
                <button type="button" id="preview-cheat-close" class="preview-cheat-close" aria-label="Chiudi pannello">×</button>
            </div>
            <div id="preview-cheat-status" class="preview-cheat-status">Mano: — carte</div>
            <div id="preview-cheat-targets" aria-label="Destinatario carte"></div>
            <input type="search" id="preview-cheat-search" class="preview-cheat-search" placeholder="Cerca carta…" autocomplete="off">
        </div>
        <div id="preview-cheat-filters"></div>
        <div id="preview-cheat-list" class="no-scrollbar"></div>
        <div class="preview-cheat-foot">
            <button type="button" id="preview-cheat-clear" class="preview-cheat-foot-btn preview-cheat-foot-btn--danger">Svuota mano selezionata</button>
            <button type="button" id="preview-cheat-refresh" class="preview-cheat-foot-btn preview-cheat-foot-btn--ghost">Aggiorna</button>
        </div>
    </aside>

    <div id="end-overlay" class="end-overlay hidden">
        <div class="end-overlay-panel">
            <h2 id="end-title" class="end-overlay-title">—</h2>
            <p id="end-duration" class="end-overlay-duration">—</p>
            <p id="end-rewards" class="end-overlay-rewards"></p>
            <div id="end-overlay-actions" class="end-overlay-actions hidden"></div>
            <p class="end-overlay-hint">Usa «Nuova partita» nella barra in alto o ricarica la pagina.</p>
        </div>
    </div>

    <script src="js/game-client.js"></script>
    <script src="js/game-preview-cheat.js"></script>
</body>
</html>
