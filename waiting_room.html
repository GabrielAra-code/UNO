<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNO? REVOLUTION - Sala d'Attesa</title>
    
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');

        body {
            font-family: 'Nunito', sans-serif;
            background: radial-gradient(circle at center, #0f1e43 0%, #070f24 100%) !important;
            user-select: none;
            color: #e2e8f0; /* Light slate for general text */
        }

        .game-panel-dark {
            background-color: #0b111e;
            border: 2px solid #1e293b;
        }

        .btn-chunky {
            border-radius: 1.5rem;
            border: 3px solid rgba(0, 0, 0, 0.2);
            transition: all 0.1s ease;
            position: relative;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .btn-yellow { background-color: #facc15; color: #451a03; box-shadow: 0 8px 0 #ca8a04; }
        .btn-pink { background-color: #ec4899; color: #ffffff; box-shadow: 0 8px 0 #be185d; }
        .btn-cyan { background-color: #22d3ee; color: #083344; box-shadow: 0 8px 0 #0891b2; }
        .btn-purple { background-color: #a855f7; color: #ffffff; box-shadow: 0 8px 0 #7e22ce; }
        .btn-red { background-color: #ef4444; color: #ffffff; box-shadow: 0 8px 0 #b91c1c; }
        .btn-slate { background-color: #475569; color: #ffffff; box-shadow: 0 8px 0 #1e293b; }
        .btn-emerald { background-color: #10b981; color: #ffffff; box-shadow: 0 8px 0 #047857; }

        .btn-chunky:hover {
            filter: brightness(1.1);
            transform: translateY(-2px);
        }

        .btn-chunky:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 transparent !important;
        }

        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }

        .modal-content:not(.hidden) {
            animation: modal-pop 0.24s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @keyframes modal-pop {
            0% { opacity: 0; transform: translateY(14px) scale(0.94); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes waiting-text-anim {
            0% { transform: rotate(-2deg) scale(1); opacity: 0.8; }
            50% { transform: rotate(2deg) scale(1.02); opacity: 1; }
            100% { transform: rotate(-2deg) scale(1); opacity: 0.8; }
        }
        .animate-waiting-text {
            animation: waiting-text-anim 4s ease-in-out infinite;
        }

        /* Card styling for Card Summary Window */
        .card-item {
            width: 100px; /* Fixed width for card */
            height: 150px; /* Fixed height for card */
            background-color: #1a202c; /* Dark background */
            border: 2px solid #4a5568; /* Border color */
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 5px;
            position: relative;
            overflow: hidden;
            text-align: center;
            font-size: 0.75rem;
            font-weight: bold;
            color: #e2e8f0;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            transition: all 0.2s ease;
        }
        .card-item.disabled {
            opacity: 0.3;
            filter: grayscale(100%);
            pointer-events: none;
        }
        .card-item .card-quantity-total {
            position: absolute;
            top: 5px;
            right: 5px;
            background-color: rgba(0,0,0,0.5);
            padding: 2px 5px;
            border-radius: 5px;
            font-size: 0.6rem;
            color: #cbd5e0;
        }
        .card-item .card-name {
            margin-top: auto;
            margin-bottom: auto;
            font-size: 0.8rem;
            line-height: 1.1;
        }
        .card-item .card-controls {
            display: flex;
            justify-content: space-between;
            width: 100%;
            padding: 0 5px;
            margin-top: auto;
        }
        .card-item .card-controls button {
            background-color: #4a5568;
            color: white;
            border: none;
            border-radius: 5px;
            width: 25px;
            height: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1rem;
            transition: background-color 0.1s ease;
        }
        .card-item .card-controls button:hover {
            background-color: #64748b;
        }
        .card-item .card-controls .current-quantity {
            font-size: 0.9rem;
            color: #a0aec0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 30px;
        }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js"; // FIX: Importazione corretta da firebase-auth.js
        import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, query, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js"; // FIX: Importazione corretta da firebase-firestore.js
        import { databaseCarte } from './js/carte.js'; // Import the card database

        const firebaseConfig = {
            apiKey: "AIzaSyBT06wDHSxgTNhsYLHutUgxTtvj6IQ4HR8", // Replace with your actual API key
            authDomain: "unoforse-a553d.firebaseapp.com", // Replace with your actual auth domain
            databaseURL: "https://unoforse-a553d-default-rtdb.europe-west1.firebasedatabase.app", // Replace with your actual database URL
            projectId: "unoforse-a553d", // Replace with your actual project ID
            storageBucket: "unoforse-a553d.firebasestorage.app", // Replace with your actual storage bucket
            messagingSenderId: "396941322053", // Replace with your actual messaging sender ID
            appId: "1:396941322053:web:86b8f596b4e05aac8ec02c", // Replace with your actual app ID
            measurementId: "G-9SEK0SY996" // Replace with your actual measurement ID
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.auth = auth;
        window.db = db;
        window.signOut = signOut;
        window.doc = doc;
        window.getDoc = getDoc;
        window.setDoc = setDoc;
        window.updateDoc = updateDoc;
        window.collection = collection;
        window.query = query;
        window.orderBy = orderBy;
        window.limit = limit;
        window.getDocs = getDocs;
        window.databaseCarte = databaseCarte; // Make card database globally accessible for now

        // Sincronizzazione parametri URL
        const parametriUrl = new URLSearchParams(window.location.search);
        const stanzaIdFromUrl = parametriUrl.get('stanzaId');
        const ruoloUtenteFromUrl = parametriUrl.get('ruolo'); // Sarà 'host' per chi crea

        let currentLobby = null;
        let currentUser = null;
        let isHost = false; // This will be determined by ruoloUtenteFromUrl

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = "index.html";
            } else {
                currentUser = user;
                window.currentUserUid = user.uid;
                await rinfrescaDatiProfiloUtente(); // Assuming this function exists globally or is imported
                await loadLobbyDetails(); // Load lobby details from Firestore
                inizializzaPannelloSalaAttesa(); // Initialize panel after lobby details are loaded
                renderLobbyScreen(); // Render screen after everything is set up
            }
        });

        async function loadLobbyDetails() {
            if (!stanzaIdFromUrl) {
                alert("Nessuna lobby selezionata. Tornando alla lobby principale.");
                window.location.href = "lobby.html";
                return;
            }

            try {
                const lobbyDocRef = doc(db, "stanze", stanzaIdFromUrl);
                const lobbyDoc = await getDoc(lobbyDocRef);

                if (!lobbyDoc.exists()) {
                    alert("Lobby non trovata. Tornando alla lobby principale.");
                    window.location.href = "lobby.html";
                    return;
                }

                currentLobby = lobbyDoc.data();
                currentLobby.id = lobbyDoc.id; // Ensure ID is part of the object

                // Determine if current user is host based on URL parameter
                isHost = (ruoloUtenteFromUrl === 'host');

                // Ensure current user is in the players list (if not already)
                if (!currentLobby.giocatori) {
                    currentLobby.giocatori = [];
                }
                const userDocRef = doc(db, "utenti", currentUser.uid);
                const userDoc = await getDoc(userDocRef);
                const userData = userDoc.exists() ? userDoc.data() : {};

                if (!currentLobby.giocatori.some(p => p.uid === currentUser.uid)) {
                    currentLobby.giocatori.push({
                        uid: currentUser.uid,
                        nickname: userData.nickname || "Player",
                        avatar: userData.avatar || "🦊",
                        level: userData.livello || 1,
                        ruolo: isHost ? "host" : "player" // Assign role based on URL
                    });
                    // Update Firestore with new player
                    await updateDoc(lobbyDocRef, {
                        giocatori: currentLobby.giocatori
                    });
                }
                currentLobby.currentPlayers = currentLobby.giocatori.length; // Update player count
            } catch (error) {
                console.error("Error loading lobby details:", error);
                alert("Errore nel caricamento della lobby: " + error.message);
                window.location.href = "lobby.html";
                return;
            }
        }

        function renderLobbyScreen() {
            document.getElementById('lobby-name').innerText = currentLobby.nome.toUpperCase();
            document.getElementById('lobby-id').innerText = currentLobby.id;
            document.getElementById('lobby-owner').innerText = currentLobby.owner;
            document.getElementById('lobby-type').innerText = currentLobby.locked ? 'Privata 🔒' : 'Pubblica 🌍';
            // Find owner nickname from players list
            const ownerPlayer = currentLobby.giocatori.find(p => p.uid === currentLobby.hostUid);
            document.getElementById('lobby-owner').innerText = ownerPlayer ? ownerPlayer.nickname : 'Sconosciuto';
            document.getElementById('lobby-players-count').innerText = `${currentLobby.giocatori.length}/${currentLobby.maxGiocatori}`;

            renderPlayerList();
        }

        function renderPlayerList() {
            const playerListContainer = document.getElementById('player-list');
            playerListContainer.innerHTML = '';
            currentLobby.giocatori.forEach(player => { // Use currentLobby.giocatori
                const playerElement = document.createElement('div');
                playerElement.className = 'flex items-center gap-3 p-2 bg-black/40 rounded-xl border border-slate-800';
                playerElement.innerHTML = `
                    <div class="w-8 h-8 bg-slate-950 rounded-full flex items-center justify-center text-lg border-2 border-slate-800">${player.avatar}</div>
                    <div class="flex-1">
                        <div class="font-bold text-sm text-white">${player.nickname} ${player.uid === currentLobby.hostUid ? '<span class="text-amber-400 text-xs">(Host)</span>' : ''}</div>
                        <div class="text-xs text-slate-400">Livello ${player.level}</div>
                    </div>
                    ${ruoloUtenteFromUrl === 'host' && player.uid !== currentUser.uid ? `
                        <div class="relative group">
                            <button class="text-slate-500 hover:text-white">⋮</button>
                            <div class="absolute right-0 top-full mt-1 w-40 bg-slate-800 rounded-lg shadow-lg hidden group-hover:block z-10">
                                <button class="block w-full text-left px-3 py-2 text-sm text-white hover:bg-slate-700 rounded-t-lg">Visualizza Profilo</button>
                                <button class="block w-full text-left px-3 py-2 text-sm text-red-400 hover:bg-slate-700">Espelli Giocatore</button>
                                <button class="block w-full text-left px-3 py-2 text-sm text-red-500 hover:bg-slate-700">Banna Giocatore</button>
                                <button class="block w-full text-left px-3 py-2 text-sm text-emerald-400 hover:bg-slate-700 rounded-b-lg">Nomina Host</button>
                            </div>
                        </div>
                    ` : ''}
                `;
                playerListContainer.appendChild(playerElement);
            });
        }

        function inizializzaPannelloSalaAttesa() {
            const hostControls = document.getElementById('host-controls');
            const btnAvviaPartita = document.getElementById('btn-avvia-partita');
            const playerWaitingMessage = document.getElementById('player-waiting-message');

            if (ruoloUtenteFromUrl === 'host') {
                console.log("Benvenuto Capo! Sei l'Host di questa lobby.");
                
                if (hostControls) hostControls.classList.remove('hidden');
                if (playerWaitingMessage) playerWaitingMessage.classList.add('hidden');
                if (btnAvviaPartita) {
                    btnAvviaPartita.removeAttribute('disabled');
                    btnAvviaPartita.classList.remove('opacity-50', 'cursor-not-allowed');
                    btnAvviaPartita.innerText = "Avvia Partita";
                }
            } else {
                console.log("Sei entrato come ospite.");
                
                if (hostControls) hostControls.classList.add('hidden');
                if (playerWaitingMessage) playerWaitingMessage.classList.remove('hidden');
                if (btnAvviaPartita) {
                    btnAvviaPartita.setAttribute('disabled', 'true');
                    btnAvviaPartita.classList.add('opacity-50', 'cursor-not-allowed');
                    btnAvviaPartita.innerText = "⏳ IN ATTESA DELL'HOST...";
                }
            }
        }

        window.openModal = function(id) {
            const overlay = document.getElementById('modal-overlay');
            const modal = document.getElementById(id);
            if(overlay && modal) {
                overlay.classList.remove('hidden');
                modal.classList.remove('hidden');
            }
        }

        window.closeModal = function() {
            const overlay = document.getElementById('modal-overlay');
            document.querySelectorAll('.modal-content').forEach(m => m.classList.add('hidden'));
            if(overlay) overlay.classList.add('hidden');
        }

        window.renderCardSummary = function(filterText = "") {
            const container = document.getElementById('card-summary-grid');
            container.innerHTML = '';
            const queryNorm = filterText.toLowerCase().trim();

            // Simulate lobby-specific card quantities
            if (!currentLobby.cardQuantities) {
                currentLobby.cardQuantities = {};
                databaseCarte.forEach(card => {
                    // Default quantities, parse "2 per colore", "4", "1", "Da definire"
                    let defaultQty = 0;
                    if (card.quantita.includes("per numero") || card.quantita.includes("per colore")) {
                        defaultQty = 8; // Example: 2 per 4 colors = 8, or 2 per 10 numbers = 20 (simplified)
                    } else if (card.quantita === "4") {
                        defaultQty = 4;
                    } else if (card.quantita === "1") {
                        defaultQty = 1;
                    } else if (card.quantita === "2") {
                        defaultQty = 2;
                    } else if (card.quantita === "6") {
                        defaultQty = 6;
                    } else {
                        defaultQty = 2; // Fallback for "Da definire" or other
                    }
                    currentLobby.cardQuantities[card.id] = defaultQty;
                });
            }

            databaseCarte.forEach(card => {
                const cardName = card.nome.toLowerCase();
                if (queryNorm && !cardName.includes(queryNorm)) {
                    return;
                }

                const currentQty = currentLobby.cardQuantities[card.id] || 0;
                const isDisabled = currentQty === 0;

                const cardElement = document.createElement('div');
                cardElement.className = `card-item ${isDisabled ? 'disabled' : ''}`;
                cardElement.innerHTML = `
                    <span class="card-quantity-total">x${card.quantita.replace('Da definire', '?')}</span>
                    <div class="card-name">${card.nome}</div>
                    <div class="card-controls">
                        <button onclick="updateCardQuantity('${card.id}', -1)">-</button>
                        <span class="current-quantity">${currentQty}</span>
                        <button onclick="updateCardQuantity('${card.id}', 1)">+</button>
                    </div>
                `;
                container.appendChild(cardElement);
            });
        }

        window.updateCardQuantity = function(cardId, change) {
            if (!currentLobby || !currentLobby.cardQuantities) return;

            let currentQty = currentLobby.cardQuantities[cardId] || 0;
            currentQty += change;
            if (currentQty < 0) currentQty = 0;
            if (currentQty > 99) currentQty = 99; // Arbitrary max for display

            currentLobby.cardQuantities[cardId] = currentQty;

            // Re-render the card summary to reflect changes
            renderCardSummary(document.getElementById('card-search-input').value);

            // In a real app, you'd save this to Firestore
            // For demo, update localStorage
            const lobbies = JSON.parse(localStorage.getItem('unoLobbyList') || '[]');
            const updatedLobbies = lobbies.map(l => l.id === currentLobby.id ? currentLobby : l);
            localStorage.setItem('unoLobbyList', JSON.stringify(updatedLobbies));
        }

        window.leaveLobby = function() {
            // In a real app, you'd remove the user from the lobby in Firestore
            // For this demo, we just redirect
            window.location.href = "lobby.html";
        };

        // Placeholder for rinfrescaDatiProfiloUtente if not imported
        window.rinfrescaDatiProfiloUtente = async function() {
            // This function would typically fetch and update user profile data
            // For now, it's a no-op to prevent errors
            console.log("rinfrescaDatiProfiloUtente called in waiting_room.html");
        };
    </script>
</head>
<body class="w-full h-screen flex flex-col p-6">

    <!-- Header -->
    <header class="flex justify-between items-center mb-4">
        <div>
            <h1 class="text-5xl font-black text-amber-500 tracking-tight drop-shadow-[0_3px_0_rgba(0,0,0,1)] -rotate-1">UNO?</h1>
            <span class="bg-pink-600 px-3 py-0.5 rounded-full text-[10px] font-black uppercase shadow-md inline-block text-white tracking-widest">Revolution</span>
        </div>
        <div class="flex items-center gap-4 game-panel-dark px-5 py-2 rounded-2xl shadow-xl">
            <div class="avatar-render w-10 h-10 bg-slate-950 rounded-full flex items-center justify-center text-xl border-2 border-slate-800">🦊</div>
            <div>
                <div id="header-nickname" class="font-black text-sm tracking-wide text-white">CARICAMENTO...</div>
                <div class="text-[10px] text-emerald-400 font-bold uppercase tracking-wider">Online</div>
            </div>
        </div>
    </header>

    <!-- Main Lobby Content -->
    <main class="flex-1 flex gap-6 mt-4">
        <!-- Left Column: Player List (30-35%) -->
        <div class="w-full lg:w-1/3 flex flex-col game-panel-dark p-5 rounded-3xl shadow-xl">
            <h2 class="text-xl font-black text-cyan-400 mb-4 uppercase">Giocatori in Lobby</h2>
            <div id="player-list" class="flex-1 space-y-3 custom-scroll pr-2">
                <!-- Player list will be rendered here -->
            </div>
            <button onclick="leaveLobby()" class="btn-chunky btn-red w-full py-3.5 text-sm cursor-pointer mt-4">Lascia Lobby</button>
        </div>

        <!-- Right Column: Host Controls / Player Waiting (65-70%) -->
        <div class="w-full lg:w-2/3 flex flex-col game-panel-dark p-5 rounded-3xl shadow-xl relative">
            <!-- Lobby Info Header -->
            <div class="mb-6 pb-4 border-b border-slate-800">
                <h2 class="text-2xl font-black text-amber-500 uppercase" id="lobby-name">Nome Lobby</h2>
                <p class="text-sm text-slate-400 font-bold mt-1">ID: <span id="lobby-id">#XXXXXX</span> | Host: <span id="lobby-owner"></span> | Tipo: <span id="lobby-type"></span> | Giocatori: <span id="lobby-players-count"></span></p>
            </div>

            <!-- Host Controls (Visible only to host) -->
            <div id="host-controls" class="flex-1 flex flex-col gap-4 hidden">
                <h3 class="text-xl font-black text-emerald-400 uppercase mb-2">Configurazioni Avanzate Lobby</h3>
                
                <div class="grid grid-cols-2 gap-4">
                    <button onclick="openModal('modal-card-summary')" class="btn-chunky btn-purple p-4 flex flex-col items-center justify-center gap-1.5 cursor-pointer">
                        <span class="text-3xl">🃏</span>
                        <span class="text-base font-black">Riepilogo Carte</span>
                    </button>
                    <button class="btn-chunky btn-cyan p-4 flex flex-col items-center justify-center gap-1.5 cursor-pointer opacity-50 cursor-not-allowed">
                        <span class="text-3xl">⚙️</span>
                        <span class="text-base font-black">Regole Speciali</span>
                    </button>
                    <!-- Add more advanced config buttons here -->
                </div>

                <div class="flex-1"></div> <!-- Spacer -->

                <div class="flex gap-4 mt-auto">
                    <button class="btn-chunky btn-red flex-1 py-3.5 text-sm cursor-pointer">Chiudi Lobby</button>
                    <button id="btn-avvia-partita" class="btn-chunky btn-emerald flex-1 py-3.5 text-sm cursor-pointer">Avvia Partita</button>
                </div>
            </div>

            <!-- Player Waiting Message (Visible only to normal players) -->
            <div id="player-waiting-message" class="flex-1 flex items-center justify-center hidden">
                <p class="text-4xl font-black text-slate-500 text-center animate-waiting-text transform -rotate-2">
                    In attesa che l'host avvii la partita...
                </p>
            </div>
        </div>
    </main>

    <!-- Modali Overlay -->
    <div id="modal-overlay" class="fixed inset-0 bg-black/85 backdrop-blur-sm z-40 hidden flex items-center justify-center p-4">

        <!-- Modal: Card Summary Window -->
        <div id="modal-card-summary" class="modal-content hidden game-panel-dark w-full max-w-4xl p-6 rounded-3xl flex flex-col gap-4 relative">
            <button onclick="closeModal()" class="absolute -top-3 -right-3 w-10 h-10 btn-chunky btn-red flex items-center justify-center text-sm cursor-pointer">X</button>
            <h2 class="text-2xl font-black text-purple-400 text-center uppercase">Riepilogo Carte Lobby</h2>
            
            <div class="relative mb-4">
                <input type="text" id="card-search-input" placeholder="🔍 Cerca carta per nome..." 
                    class="w-full bg-slate-950 rounded-xl px-4 py-2.5 text-white font-bold text-xs outline-none border-2 border-slate-800 focus:border-purple-500 transition-all placeholder:text-slate-600"
                    oninput="renderCardSummary(this.value)">
            </div>

            <div id="card-summary-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 custom-scroll max-h-[60vh] overflow-y-auto pr-2">
                <!-- Cards will be rendered here -->
            </div>
        </div>
    </div>

    <script>
        // Initial render of card summary when modal opens
        document.getElementById('modal-card-summary').addEventListener('transitionend', (event) => {
            if (!document.getElementById('modal-card-summary').classList.contains('hidden')) {
                renderCardSummary();
            }
        });
    </script>
</body>
</html>
