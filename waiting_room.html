<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sala d'attesa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');
        *, *::before, *::after {
            box-sizing: border-box;
        }
        html {
            height: 100%;
        }
        body {
            margin: 0;
            min-height: 100vh;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            font-family: 'Nunito', sans-serif;
            background: radial-gradient(circle at center, #0f1e43 0%, #070f24 100%);
            color: #ffffff;
            user-select: none;
        }
        .container {
            max-width: 1120px;
            width: min(100%, 1120px);
            margin: 0 auto;
            padding: 12px;
        }
        .game-panel-dark,
        .card {
            background-color: #0b111e;
            border: 2px solid #1e293b;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.9);
        }
        .card-inner {
            padding: 20px;
            border-radius: 28px;
            max-height: calc(100vh - 40px);
            overflow: hidden;
        }
        .title-small {
            letter-spacing: 0.35em;
            font-size: 0.72rem;
            color: #94a3b8;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        .code-value {
            letter-spacing: 0.4em;
            color: #f8b800;
        }
        .btn-chunky,
        .button-primary,
        .button-secondary {
            border-radius: 1.5rem;
            border: 3px solid rgba(0, 0, 0, 0.2);
            transition: all 0.1s ease;
            position: relative;
            font-weight: 900;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .btn-yellow,
        .button-primary {
            background-color: #facc15;
            color: #451a03;
            box-shadow: 0 8px 0 #ca8a04;
        }
        .btn-slate,
        .button-secondary {
            background-color: #475569;
            color: #f8fafc;
            box-shadow: 0 8px 0 #1e293b;
        }
        .btn-red {
            background-color: #ef4444;
            color: #ffffff;
            box-shadow: 0 8px 0 #b91c1c;
        }
        .btn-emerald {
            background-color: #10b981;
            color: #ffffff;
            box-shadow: 0 8px 0 #047857;
        }
        .btn-chunky:hover,
        .button-primary:hover,
        .button-secondary:hover,
        .btn-yellow:hover,
        .btn-slate:hover,
        .btn-red:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }
        .btn-chunky:active,
        .button-primary:active,
        .button-secondary:active,
        .btn-yellow:active,
        .btn-slate:active,
        .btn-red:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 transparent !important;
        }
        .setting-pill {
            display: inline-flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            min-width: 0;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 18px;
            padding: 10px 12px;
            gap: 8px;
            color: #e2e8f0;
            font-size: 0.84rem;
        }
        .setting-pill span:last-child {
            color: #34d399;
            font-weight: 800;
        }
        .toggle-switch {
            display: inline-flex;
            align-items: center;
            justify-content: flex-start;
            width: 52px;
            height: 28px;
            border-radius: 9999px;
            background-color: #1f2937;
            border: 1px solid #334155;
            padding: 3px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        .toggle-switch.on {
            background-color: #10b981;
            justify-content: flex-end;
            border-color: #047857;
        }
        .toggle-switch .thumb {
            width: 22px;
            height: 22px;
            border-radius: 9999px;
            background-color: #ffffff;
            box-shadow: 0 10px 16px rgba(0, 0, 0, 0.24);
            transition: transform 0.2s ease;
        }
        .option-pill {
            width: 56px;
            height: 56px;
            border-radius: 9999px;
            border: 1px solid #334155;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.2s ease;
            background-color: #111827;
            color: #94a3b8;
        }
        .option-pill.selected {
            background-color: #facc15;
            color: #0f172a;
            border-color: #f59e0b;
            box-shadow: 0 8px 0 #ca8a04;
        }
        .room-input {
            width: 100%;
            background-color: #0f172a;
            color: #ffffff;
            border: 1px solid #334155;
            border-radius: 28px;
            padding: 0.9rem 1rem;
            font-weight: 900;
            outline: none;
        }
        .room-input::placeholder {
            color: #94a3b8;
        }
        .room-input:focus {
            border-color: #f7c74b;
            box-shadow: 0 0 0 4px rgba(247, 199, 59, 0.12);
        }
        .custom-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.35);
            border-radius: 9999px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: transparent;
        }
        .alert-pill {
            display: inline-flex;
            padding: 8px 12px;
            border-radius: 9999px;
            background: rgba(248, 184, 0, 0.12);
            color: #f7c74b;
            font-weight: 800;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            font-size: 0.72rem;
        }
        .players-empty {
            border: 1px dashed rgba(148, 163, 184, 0.24);
            border-radius: 18px;
            padding: 14px;
            text-align: center;
            color: #94a3b8;
            font-size: 0.95rem;
        }
        .section-spacing {
            margin-top: 12px;
        }
        .waiting-grid {
            display: grid;
            grid-template-columns: minmax(260px, 0.34fr) minmax(0, 0.66fr);
            gap: 16px;
            min-height: min(680px, calc(100vh - 80px));
        }
        .waiting-column {
            min-height: 0;
            background-color: #0b111e;
            border: 2px solid #1e293b;
            border-radius: 28px;
            box-shadow: 0 16px 30px rgba(0, 0, 0, 0.35);
        }
        .settings-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }
        @media (max-width: 820px) {
            body {
                align-items: flex-start;
            }
            .card-inner {
                max-height: none;
                overflow: visible;
            }
            .waiting-grid,
            .settings-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>

</head>
<body>

    <script>

            { id: "c_scudo", nome: "Scudo", quantita: 4, effetto: "Protegge solo da Blobby e Proiettile. Si consuma quando salva il giocatore.", cat: "⭐ Speciale UNO?" },
            { id: "c_death", nome: "Death Note", quantita: 1, effetto: "Eliminazione immediata di un giocatore a scelta.", cat: "⭐ Speciale UNO?" },
            { id: "c_blobby", nome: "Blobby", quantita: 1, effetto: "Vittoria istantanea. Se il bersaglio ha Scudo, lo Scudo si consuma e il bersaglio sopravvive.", cat: "⭐ Speciale UNO?" },
            { id: "c_righello", nome: "Righello o X?", quantita: 4, effetto: "Giocabile fuori dal turno. Annulla interamente l'ultima mossa.", cat: "⭐ Speciale UNO?" },
            { id: "c_donna", nome: "Donna di Mazze", quantita: 1, effetto: "Resetta e annulla tutte le catene ed effetti attivi globali sul tavolo.", cat: "⭐ Speciale UNO?" },
            { id: "c_imprevisti", nome: "Imprevisti", quantita: 1, effetto: "Appena entra in mano si gioca da sola. Tutti pescano una carta.", cat: "⚪ Speciale Incolore" },
            { id: "c_scambio", nome: "Scambio", quantita: 2, effetto: "Scambia l'intera mano di carte con un giocatore bersaglio.", cat: "⭐ Speciale UNO?" },

            { id: "c_messa", nome: "La Messa è Finita", quantita: 1, effetto: "Prende tutti i rifiuti e gli scarti accumulati e li rimescola nel deck.", cat: "🎯 Cutruzzolà Move" },
            { id: "c_piani", nome: "Piani di Proiezione (P.V/P.L/P.O/L.T)", quantita: 1, effetto: "Chi unisce tutti e 4 i pezzi sblocca la vittoria suprema.", cat: "📐 Piani di Proiezione" },
            { id: "c_brainrot", nome: "Brainrot Battle", quantita: 1, effetto: "Inizia una sfida Brainrot globale. Il punteggio PT più alto vince.", cat: "🧠 Brainrot" },
            { id: "c_specchio", nome: "Specchio", quantita: 1, effetto: "Riflette l'effetto scagliato contro l'utilizzatore al mittente.", cat: "❓ Non Definita" }

        function readLobbyList() {
            try {
                return JSON.parse(localStorage.getItem('unoLobbyList') || '[]');
            } catch (error) {
                return [];
            }
        }

        function saveLobbyList(list) {
            localStorage.setItem('unoLobbyList', JSON.stringify(list));
        }

        function findLobby() {
            const list = readLobbyList();
            return list.find(room => room.id === stanzaId);
        }

        function updateLobby(updateFn) {
            const list = readLobbyList();
            const index = list.findIndex(room => room.id === stanzaId);
            if (index === -1) return null;
            updateFn(list[index]);
            saveLobbyList(list);
            return list[index];
        }

        function initializeLobbyData() {
            const currentLobby = findLobby();
            if (!currentLobby) return null;
            currentLobby.settings = currentLobby.settings || { brainrot: true, stack: true, pistolHp: 3 };
            if (!currentLobby.cardQuantities) {
                currentLobby.cardQuantities = {};
                databaseCarte.forEach(carta => {
                    currentLobby.cardQuantities[carta.id] = carta.quantita || 1;
                });
                saveLobbyList(readLobbyList());
            }
            return currentLobby;
        }

        function renderWaitingRoom() {
            const roomCodeEl = document.getElementById('room-code');
            const playerCountEl = document.getElementById('player-count');
            const playersList = document.getElementById('players-list');
            const playersEmpty = document.getElementById('players-empty');
            const startButton = document.getElementById('btn-start-game');
            const currentLobby = initializeLobbyData();

            if (!currentLobby) {
                alert('La lobby non è più disponibile.');
                window.location.href = 'Menu_principale.html';
                return;
            }

            roomCodeEl.innerText = currentLobby.id || '—';
            playerCountEl.innerText = `${(currentLobby.players?.length || 0)}/${currentLobby.maxPlayers || 6}`;
            document.getElementById('setting-max-players').innerText = currentLobby.maxPlayers || 6;
            document.getElementById('setting-privacy').innerText = currentLobby.locked ? 'Privata' : 'Pubblica';
            document.getElementById('setting-status').innerText = currentLobby.status === 'started' ? 'Avviata' : 'In attesa';
            playersList.innerHTML = '';
            const players = currentLobby.players || [];
            players.forEach(player => {
                const item = document.createElement('div');
                item.className = 'rounded-2xl border border-slate-800 bg-slate-900/80 p-4 flex items-center justify-between gap-3';
                item.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-2xl bg-slate-800 flex items-center justify-center text-lg">${player.avatar || '🃏'}</div>
                        <div>
                            <div class="font-black text-slate-100">${player.nickname || 'Giocatore'}</div>
                            <div class="text-[11px] uppercase tracking-[0.2em] text-slate-500">${player.role === 'host' ? 'Host' : 'Giocatore'}</div>
                        </div>
                    </div>
                    <div class="text-[11px] font-black uppercase ${player.isSelf ? 'text-amber-300' : 'text-slate-400'}">${player.isSelf ? 'TU' : ''}</div>
                `;
                playersList.appendChild(item);
            });

            playersEmpty.classList.toggle('hidden', players.length > 0);
            document.getElementById('toggle-brainrot-btn').classList.toggle('on', currentLobby.settings.brainrot);
            document.getElementById('toggle-stack-btn').classList.toggle('on', currentLobby.settings.stack);
            [2, 3, 5].forEach(value => {
                document.getElementById(`pistolhp-${value}`)?.classList.toggle('selected', currentLobby.settings.pistolHp === value);
            });
            document.getElementById('role-badge').innerText = isHost ? 'Host' : 'Ospite';
            startButton.classList.toggle('hidden', !isHost);
            document.querySelectorAll('.toggle-switch').forEach(btn => {
                btn.disabled = !isHost;
                btn.classList.toggle('opacity-40', !isHost);
            });
            document.querySelectorAll('.option-pill').forEach(btn => {
                btn.disabled = !isHost;
                btn.classList.toggle('opacity-40', !isHost);
            });
        }

        let sfxVolume = parseFloat(localStorage.getItem('sfxVolume') || '1');
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSynth(type) {
            if (sfxVolume <= 0) return;
            if (audioCtx.state === 'suspended') {
                audioCtx.resume().then(() => playSynth(type)).catch(() => {});
                return;
            }
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            const now = audioCtx.currentTime;
            const volumeEffettivo = 0.2 * sfxVolume;

            if (type === 'pop') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(600, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
                gainNode.gain.setValueAtTime(volumeEffettivo, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'bloop') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(550, now + 0.15);
                gainNode.gain.setValueAtTime(volumeEffettivo, now);
                gainNode.gain.linearRampToValueAtTime(0.01, now + 0.15);
                osc.start(now); osc.stop(now + 0.15);
            } else if (type === 'click') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(750, now);
                gainNode.gain.setValueAtTime(volumeEffettivo * 0.3, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.04);
                osc.start(now); osc.stop(now + 0.04);
            } else if (type === 'error') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(160, now);
                osc.frequency.exponentialRampToValueAtTime(110, now + 0.25);
                gainNode.gain.setValueAtTime(volumeEffettivo * 0.5, now);
                gainNode.gain.linearRampToValueAtTime(0.01, now + 0.25);
                osc.start(now); osc.stop(now + 0.25);
            }
        }

        function initializeSfxListeners() {
            document.addEventListener('mouseover', (event) => {
                const elemento = event.target.closest('button, [data-sound]');
                if (!elemento || !elemento.contains(event.target)) return;
                if (event.relatedTarget && elemento.contains(event.relatedTarget)) return;
                playSynth('click');
            });

            document.addEventListener('click', (event) => {
                const elemento = event.target.closest('button, [data-sound]');
                if (!elemento) return;
                const soundType = elemento.getAttribute('data-sound') || 'click';
                playSynth(soundType);
            }, true);
        }
        initializeSfxListeners();

        function copyRoomCode() {
            const codeText = document.getElementById('room-code').innerText;
            const copyButton = document.getElementById('copy-code-btn');
            navigator.clipboard.writeText(codeText).then(() => {
                copyButton.innerText = 'Copiato';
                setTimeout(() => {
                    copyButton.innerText = 'Copia';
                }, 1100);
            }).catch(() => {
                copyButton.innerText = 'Errore';
                playSynth('error');
                setTimeout(() => {
                    copyButton.innerText = 'Copia';
                }, 1100);
            });
        }

        function leaveLobby() {
            const list = readLobbyList();
            const index = list.findIndex(room => room.id === stanzaId);
            if (index !== -1) {
                if (isHost) {
                    list[index].status = 'closed';
                } else {
                    list[index].players = list[index].players.filter(player => !player.isSelf);
                }
                saveLobbyList(list);
            }
            setTimeout(() => {
                window.location.href = 'Menu_principale.html';
            }, 80);
        }

        function startGame() {
            if (!isHost) {
                alert('Solo l\'host può avviare la partita.');
                return;
            }
            const list = readLobbyList();
            const index = list.findIndex(room => room.id === stanzaId);
            if (index === -1) {
                alert('Lobby non trovata.');
                return;
            }
            if ((list[index].players?.length || 0) < 2) {
                alert('Servono almeno 2 giocatori per avviare la partita.');
                return;
            }
            list[index].status = 'started';
            saveLobbyList(list);
            alert('Partita avviata!');
            renderWaitingRoom();
        }

        function toggleLobbySetting(setting) {
            if (!isHost) {
                alert('Solo l\'host può modificare le impostazioni.');
                return;
            }
            updateLobby(lobbyData => {
                lobbyData.settings[setting] = !lobbyData.settings[setting];
            });
            renderWaitingRoom();
        }

        function selectPistolHp(value) {
            if (!isHost) {
                alert('Solo l\'host può modificare le impostazioni.');
                return;
            }
            updateLobby(lobbyData => {
                lobbyData.settings.pistolHp = value;
            });
            document.querySelectorAll('.option-pill').forEach(btn => btn.classList.remove('selected'));
            document.getElementById(`pistolhp-${value}`)?.classList.add('selected');
            renderWaitingRoom();
        }

        function openCardSummary() {
            renderCardSummary(document.getElementById('card-summary-search').value || '');
            document.getElementById('card-summary-modal').classList.remove('hidden');
        }

        function closeCardSummary() {
            document.getElementById('card-summary-modal').classList.add('hidden');
        }

        function cardIcon(carta) {
            if (carta.cat.includes('Classico')) return '🎴';
            if (carta.cat.includes('Nero')) return '🖤';
            if (carta.cat.includes('Evento')) return '🌍';
            if (carta.cat.includes('Speciale')) return '✨';
            if (carta.cat.includes('Brainrot')) return '🧠';
            return '🃏';
        }

        function renderCardSummary(filter = '') {
            const currentLobby = initializeLobbyData();
            const query = filter.toLowerCase().trim();
            const grid = document.getElementById('summary-cards-grid');
            grid.innerHTML = '';
            if (!currentLobby) return;

            databaseCarte.filter(carta => {
                const search = `${carta.nome} ${carta.effetto} ${carta.cat}`.toLowerCase();
                return !query || search.includes(query);
            }).forEach(carta => {
                const quantity = currentLobby.cardQuantities[carta.id] ?? 0;
                const disabled = quantity === 0;
                const card = document.createElement('div');
                card.className = `rounded-3xl border p-4 text-center transition-all ${disabled ? 'bg-slate-900/70 border-slate-700 opacity-40' : 'bg-slate-950 border-slate-800 hover:border-amber-400/40 hover:shadow-xl'}`;
                card.innerHTML = `
                    <div class="text-[32px] mb-3">${cardIcon(carta)}</div>
                    <div class="text-xs uppercase tracking-[0.35em] text-slate-500 mb-2">${carta.cat}</div>
                    <div class="font-black text-white text-sm mb-3">${carta.nome}</div>
                    <div class="text-[11px] text-slate-400 leading-relaxed mb-4">${carta.effetto}</div>
                    <div class="flex items-center justify-center gap-2">
                        <button onclick="modifyCardQuantity('${carta.id}', -1)" class="btn-chunky btn-slate w-9 h-9 rounded-2xl" data-sound="click">-</button>
                        <span class="text-2xl font-black text-amber-300">${quantity}</span>
                        <button onclick="modifyCardQuantity('${carta.id}', 1)" class="btn-chunky btn-slate w-9 h-9 rounded-2xl" data-sound="click">+</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function modifyCardQuantity(id, delta) {
            if (!isHost) {
                alert('Solo l\'host può modificare le carte.');
                return;
            }
            updateLobby(lobbyData => {
                lobbyData.cardQuantities = lobbyData.cardQuantities || {};
                lobbyData.cardQuantities[id] = Math.max(0, (lobbyData.cardQuantities[id] || 0) + delta);
            });
            renderCardSummary(document.getElementById('card-summary-search').value || '');
        }

        if (!stanzaId || !findLobby()) {
            alert('Lobby non trovata. Torna alla lobby principale.');
            window.location.href = 'Menu_principale.html';
        } else {
            initializeLobbyData();
            renderWaitingRoom();
            window.addEventListener('storage', renderWaitingRoom);
            setInterval(renderWaitingRoom, 1000);
        }
    </script>
</body>
</html>
