<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#020617">
    <title>UNO? REVOLUTION — Tavolo</title>
    <link rel="stylesheet" href="css/mobile.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body { background: #020617; }
        .tavolo-bg {
            background: radial-gradient(ellipse 80% 70% at 50% 45%, #1e3a5f 0%, #0f172a 55%, #020617 100%);
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .table-wrap {
            position: relative;
            width: min(68vmin, 420px);
            height: min(68vmin, 420px);
            margin: 0 auto;
        }

        .table-surface {
            position: absolute;
            inset: 8%;
            border-radius: 50%;
            background: radial-gradient(circle at 40% 35%, #166534 0%, #14532d 40%, #052e16 100%);
            border: 6px solid #422006;
            box-shadow: inset 0 0 60px rgba(0,0,0,0.5), 0 12px 40px rgba(0,0,0,0.6);
            z-index: 1;
        }

        .table-direction-ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            pointer-events: none;
        }
        .table-direction-ring::before {
            content: '';
            position: absolute;
            inset: 2%;
            border-radius: 50%;
            border: 3px dashed rgba(251, 191, 36, 0.45);
            animation: spin-dir 28s linear infinite;
        }
        .table-direction-ring.dir-ccw::before {
            animation-direction: reverse;
        }
        @keyframes spin-dir {
            to { transform: rotate(360deg); }
        }

        .dir-arrow {
            position: absolute;
            width: 48px;
            height: 48px;
            color: #fbbf24;
            font-size: 40px;
            line-height: 1;
            font-weight: 900;
            text-shadow: 0 3px 12px rgba(0,0,0,0.85);
            transform: translate(-50%, -50%);
        }

        .table-seats {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 8;
        }
        .table-seat {
            position: absolute;
            left: 50%;
            top: 50%;
            width: min(22vw, 108px);
            transform: translate(-50%, -50%) rotate(var(--angle)) translateY(calc(-1 * var(--radius, 168px))) rotate(calc(-1 * var(--angle)));
            z-index: 2;
        }
        .seat-inner {
            background: rgba(15, 23, 42, 0.92);
            border: 2px solid #334155;
            border-radius: 16px;
            padding: 8px 10px;
            text-align: center;
            pointer-events: auto;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .seat-turn {
            border-color: #fbbf24;
            box-shadow: 0 0 24px rgba(251, 191, 36, 0.55);
            animation: seat-glow 1.2s ease-in-out infinite;
        }
        .seat-turn::before {
            content: '▼';
            position: absolute;
            top: -14px;
            left: 50%;
            transform: translateX(-50%);
            color: #fbbf24;
            font-size: 0.75rem;
            text-shadow: 0 0 8px rgba(251, 191, 36, 0.8);
        }
        @keyframes seat-glow {
            0%, 100% { box-shadow: 0 0 16px rgba(251, 191, 36, 0.4); }
            50% { box-shadow: 0 0 28px rgba(251, 191, 36, 0.75); }
        }
        .seat-inner { position: relative; }
        .seat-out { opacity: 0.45; }
        .seat-avatar {
            width: 2.5rem;
            height: 2.5rem;
            margin: 0 auto 4px;
            border-radius: 50%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.35rem;
            line-height: 1;
            background: #0f172a;
            border: 2px solid #475569;
        }
        .seat-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .seat-name { font-size: 0.7rem; font-weight: 800; color: #f1f5f9; margin-top: 2px; }
        .seat-meta { font-size: 0.6rem; color: #94a3b8; font-family: monospace; }
        .seat-hp { font-size: 0.55rem; color: #fb7185; font-family: monospace; }

        .table-center {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            gap: 1.25rem;
            z-index: 10;
        }

        .game-layout-row {
            display: flex;
            flex: 1;
            min-height: 0;
            width: 100%;
        }

        .game-sidebar {
            width: min(220px, 28vw);
            flex-shrink: 0;
            background: rgba(15, 23, 42, 0.92);
            border-right: 1px solid #334155;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .game-sidebar-title {
            font-size: 0.65rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: #94a3b8;
            padding: 0.75rem 0.85rem 0.5rem;
            border-bottom: 1px solid #1e293b;
        }

        #game-players-list {
            flex: 1;
            overflow-y: auto;
            padding: 0.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.45rem;
        }

        .sidebar-player {
            display: flex;
            align-items: center;
            gap: 0.55rem;
            padding: 0.45rem 0.5rem;
            border-radius: 12px;
            border: 1px solid #334155;
            background: rgba(2, 6, 23, 0.55);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .sidebar-player.sidebar-turn {
            border-color: #fbbf24;
            box-shadow: 0 0 14px rgba(251, 191, 36, 0.35);
            animation: seat-glow 1.2s ease-in-out infinite;
        }

        .sidebar-player-avatar {
            width: 2.25rem;
            height: 2.25rem;
            border-radius: 50%;
            overflow: hidden;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f172a;
            border: 2px solid #475569;
            font-size: 1.1rem;
        }

        .sidebar-player-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .sidebar-player-name {
            font-size: 0.7rem;
            font-weight: 800;
            color: #f1f5f9;
            line-height: 1.2;
        }

        .sidebar-player-meta {
            font-size: 0.58rem;
            color: #94a3b8;
            font-family: monospace;
        }

        .pile-card.pile-draw-disabled {
            opacity: 0.42;
            filter: grayscale(0.35);
            cursor: not-allowed;
        }

        .hand-card-mari {
            outline: 3px solid #22c55e;
            box-shadow: 0 0 16px rgba(34, 197, 94, 0.45);
        }

        .pile-card {
            width: 7rem;
            height: 9.5rem;
            border: 3px solid #fff;
            border-radius: 1rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 0.6rem;
            font-weight: 900;
            font-style: italic;
            color: #fff;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(0,0,0,0.45);
            transition: transform 0.15s;
        }
        .pile-card:hover { transform: scale(1.04); }
        .pile-corner { font-size: 1.1rem; }
        .pile-corner.br { align-self: flex-end; transform: rotate(180deg); }
        .pile-center {
            position: absolute;
            left: 50%; top: 50%;
            transform: translate(-50%, -50%);
            font-size: 2rem;
            font-weight: 900;
        }
        #deck-discard { position: relative; transform: rotate(6deg); }
        #deck-draw {
            background: linear-gradient(135deg, #b91c1c, #7f1d1d);
            position: relative;
        }
        #deck-draw::after {
            content: 'UNO?';
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 1.1rem;
            transform: rotate(-12deg);
            opacity: 0.9;
        }
        .draw-count {
            position: absolute;
            bottom: -8px;
            right: -8px;
            background: #0f172a;
            border: 2px solid #fbbf24;
            color: #fbbf24;
            font-size: 0.65rem;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 999px;
        }

        .color-hint {
            position: absolute;
            bottom: -2.5rem;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.65rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            white-space: nowrap;
        }
        .color-red { color: #f87171; }
        .color-yellow { color: #facc15; }
        .color-green { color: #4ade80; }
        .color-blue { color: #60a5fa; }

        /* Colori carte (sempre disponibili, anche su mobile senza Tailwind JIT) */
        .hand-card.card-red, .pile-card.card-red { background: #dc2626; color: #fff; }
        .hand-card.card-yellow, .pile-card.card-yellow { background: #eab308; color: #0f172a; }
        .hand-card.card-green, .pile-card.card-green { background: #16a34a; color: #fff; }
        .hand-card.card-blue, .pile-card.card-blue { background: #2563eb; color: #fff; }
        .hand-card.card-black, .pile-card.card-black {
            background: #0f172a; color: #fff; border-color: #f59e0b;
        }
        .hand-card.card-wild, .pile-card.card-wild {
            background: linear-gradient(135deg, #9333ea, #db2777); color: #fff;
        }
        .hand-card.card-brainrot, .pile-card.card-brainrot {
            background: #581c87; color: #fff; border-color: #c084fc;
        }
        .hand-card.card-battle-yellow { background: #eab308; color: #0f172a; border-color: #fcd34d; }
        .hand-card.card-battle-white { background: #f1f5f9; color: #0f172a; border-color: #94a3b8; }
        .hand-card.card-battle-pink { background: #ec4899; color: #fff; border-color: #f9a8d4; }
        .hand-card.card-battle-blue { background: #2563eb; color: #fff; border-color: #93c5fd; }
        .hand-card.card-default, .pile-card.card-default { background: #475569; color: #fff; }

        .hand-scroll-wrap {
            width: 100%;
            max-width: 100%;
            overflow: visible;
            position: relative;
        }
        .hand-scroll-wrap::after {
            content: '';
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 28px;
            background: linear-gradient(to left, rgba(15, 23, 42, 0.92), transparent);
            pointer-events: none;
            z-index: 2;
        }
        #my-hand {
            display: flex;
            flex-wrap: nowrap;
            align-items: flex-end;
            justify-content: flex-start;
            gap: 0.5rem;
            overflow-x: auto;
            overflow-y: visible;
            width: 100%;
            max-width: 100%;
            padding-top: 0.75rem;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-x: contain;
            scroll-snap-type: x proximity;
            scrollbar-width: thin;
            scrollbar-color: #475569 transparent;
        }
        #my-hand::-webkit-scrollbar {
            height: 6px;
        }
        #my-hand::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 999px;
        }
        #my-hand .hand-card {
            scroll-snap-align: start;
            flex: 0 0 auto;
        }
        #my-hand.hand-size-many .hand-card {
            width: 4.75rem;
            height: 7rem;
        }
        #my-hand.hand-size-many .hand-label {
            font-size: 0.8rem;
        }
        #my-hand.hand-size-crowded .hand-card {
            width: 4rem;
            height: 5.85rem;
        }
        #my-hand.hand-size-crowded .hand-label {
            font-size: 0.72rem;
        }

        .hand-card {
            flex: 0 0 auto;
            width: 5.5rem;
            height: 8rem;
            border: 2px solid #fff;
            border-radius: 1rem;
            font-weight: 900;
            color: #fff;
            cursor: pointer;
            transition: transform 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .hand-card:hover:not(.hand-card-disabled) { transform: translateY(-12px) scale(1.05); }
        .hand-card-disabled { opacity: 0.45; cursor: not-allowed; }
        .hand-card-counter {
            outline: 3px solid #f59e0b;
            box-shadow: 0 0 16px rgba(245, 158, 11, 0.45);
        }
        .hand-card-selected {
            outline: 3px solid #38bdf8;
            transform: translateY(-16px) scale(1.06);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
        }
        .hand-card-ladder-hint {
            outline: 2px dashed #a78bfa;
        }
        .hand-card-dup-group {
            outline: 2px dashed rgba(56, 189, 248, 0.65);
        }
        .hand-dup-badge,
        .hand-dup-sel {
            display: block;
            font-size: 9px;
            font-weight: 900;
            line-height: 1.1;
            margin-top: 2px;
        }
        .hand-dup-badge {
            color: #fde68a;
        }
        .hand-dup-sel {
            color: #7dd3fc;
        }

        #play-selection-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            flex-wrap: wrap;
            padding: 0.35rem 0.5rem 0.5rem;
        }
        #play-selection-bar.hidden { display: none; }
        #play-selection-label {
            font-size: 0.65rem;
            font-weight: 800;
            color: #7dd3fc;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .btn-play-confirm {
            background: linear-gradient(180deg, #38bdf8, #0284c7);
            color: #0f172a;
            border: 2px solid #bae6fd;
            border-radius: 999px;
            padding: 0.35rem 0.9rem;
            font-size: 0.65rem;
            font-weight: 900;
            text-transform: uppercase;
            box-shadow: 0 3px 0 #0369a1;
        }
        .btn-play-cancel {
            background: transparent;
            color: #94a3b8;
            border: 1px solid #475569;
            border-radius: 999px;
            padding: 0.35rem 0.75rem;
            font-size: 0.65rem;
            font-weight: 800;
        }

        .modal-target-revive {
            border-color: #4ade80 !important;
            background: linear-gradient(180deg, #166534, #14532d) !important;
        }

        .modal-color-btn, .modal-target-btn {
            width: 100%;
            padding: 0.75rem;
            border-radius: 12px;
            font-weight: 800;
            margin-bottom: 0.5rem;
            border: 2px solid #475569;
            background: #1e293b;
            color: #fff;
        }
        .modal-color-btn.color-red { background: #dc2626; border-color: #fca5a5; }
        .modal-color-btn.color-yellow { background: #eab308; color: #0f172a; border-color: #fef08a; }
        .modal-color-btn.color-green { background: #16a34a; border-color: #86efac; }
        .modal-color-btn.color-blue { background: #2563eb; border-color: #93c5fd; }

        #bullet-roulette-overlay {
            position: fixed;
            inset: 0;
            z-index: 80;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            pointer-events: none;
        }
        #bullet-roulette-overlay.active { pointer-events: auto; }
        #bullet-roulette-overlay.hidden { display: none; }

        .roulette-panel {
            width: min(92vw, 380px);
            margin-bottom: 8vh;
            padding: 1.5rem 1.25rem 1.75rem;
            background: linear-gradient(165deg, #1e293b 0%, #0f172a 55%, #020617 100%);
            border: 3px solid #fbbf24;
            border-radius: 1.75rem 1.75rem 1rem 1rem;
            box-shadow: 0 -12px 48px rgba(251, 191, 36, 0.22), 0 0 0 1px rgba(255,255,255,0.06) inset;
            transform: translateY(110%);
            transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
            text-align: center;
        }
        #bullet-roulette-overlay.active .roulette-panel {
            transform: translateY(0);
        }

        .roulette-wheel-wrap {
            position: relative;
            width: min(72vw, 280px);
            height: min(72vw, 280px);
            margin: 0.75rem auto 0;
        }

        .roulette-pointer-fixed {
            position: absolute;
            left: 50%;
            top: -6px;
            transform: translateX(-50%);
            z-index: 12;
            font-size: 2.25rem;
            color: #fef08c;
            line-height: 1;
            filter: drop-shadow(0 3px 6px rgba(0,0,0,0.9));
            pointer-events: none;
        }

        .roulette-wheel {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 6px solid #78350f;
            box-shadow:
                0 0 0 3px rgba(251, 191, 36, 0.35),
                inset 0 0 28px rgba(0,0,0,0.45),
                0 14px 36px rgba(0,0,0,0.55);
            overflow: hidden;
            will-change: transform;
            background-color: #1e293b;
        }

        .roulette-slice-label {
            position: absolute;
            z-index: 2;
            max-width: 32%;
            padding: 0 2px;
            font-size: 0.62rem;
            font-weight: 900;
            color: #fff;
            text-align: center;
            text-shadow: 0 1px 4px rgba(0,0,0,0.9), 0 0 8px rgba(0,0,0,0.6);
            line-height: 1.15;
            pointer-events: none;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .roulette-hub {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 18%;
            height: 18%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #fde68a, #b45309 70%, #78350f);
            border: 3px solid #fef3c7;
            box-shadow: inset 0 2px 8px rgba(255,255,255,0.35), 0 4px 12px rgba(0,0,0,0.5);
            z-index: 5;
            pointer-events: none;
        }

        .roulette-spin-btn {
            margin-top: 1rem;
            width: 100%;
            padding: 0.85rem;
            border-radius: 999px;
            background: #ef4444;
            color: #fff;
            font-weight: 900;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            border: 3px solid rgba(0,0,0,0.2);
            box-shadow: 0 6px 0 #b91c1c;
            cursor: pointer;
        }
        .roulette-spin-btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            box-shadow: none;
        }

        .roulette-result {
            margin-top: 0.75rem;
            font-size: 0.9rem;
            font-weight: 800;
            color: #fca5a5;
            min-height: 1.25rem;
        }

        #btn-uno.uno-flash {
            animation: uno-pulse 0.9s ease-in-out infinite;
            box-shadow: 0 0 20px rgba(251, 191, 36, 0.7);
        }
        @keyframes uno-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        .btn-end-turn {
            background: linear-gradient(180deg, #22c55e 0%, #15803d 100%);
            color: #ecfdf5;
            border: 3px solid #86efac;
            border-radius: 14px;
            padding: 0.55rem 1.25rem;
            font-size: 0.75rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            box-shadow: 0 4px 0 #14532d, 0 8px 20px rgba(34, 197, 94, 0.35);
            transition: transform 0.15s, box-shadow 0.15s, filter 0.15s;
            cursor: pointer;
        }
        .btn-end-turn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #14532d, 0 10px 24px rgba(34, 197, 94, 0.45);
            filter: brightness(1.08);
        }
        .btn-end-turn:active:not(:disabled) {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #14532d;
        }
        .btn-end-turn:disabled {
            opacity: 0.38;
            cursor: not-allowed;
            box-shadow: 0 3px 0 #334155;
        }

        #counter-overlay {
            position: fixed;
            top: 3.5rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 55;
            background: rgba(15, 23, 42, 0.95);
            border: 2px solid #f59e0b;
            border-radius: 1rem;
            padding: 0.75rem 1.25rem;
            text-align: center;
            box-shadow: 0 8px 32px rgba(245, 158, 11, 0.25);
        }
        #counter-overlay.hidden { display: none; }
        #counter-timer {
            font-size: 2.5rem;
            font-weight: 900;
            color: #fbbf24;
            font-variant-numeric: tabular-nums;
            line-height: 1;
        }
        .btn-contrast {
            margin-top: 0.5rem;
            background: linear-gradient(180deg, #f59e0b 0%, #d97706 100%);
            color: #0f172a;
            border: 2px solid #fde68a;
            border-radius: 999px;
            padding: 0.4rem 1rem;
            font-size: 0.7rem;
            font-weight: 900;
            text-transform: uppercase;
            box-shadow: 0 3px 0 #92400e;
            cursor: pointer;
            transition: transform 0.12s;
        }
        .btn-contrast:hover { transform: translateY(-1px); }

        #game-toast {
            position: fixed;
            bottom: 140px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 60;
            background: #1e293b;
            border: 1px solid #fbbf24;
            color: #fef3c7;
            padding: 0.5rem 1rem;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 700;
        }
    </style>
